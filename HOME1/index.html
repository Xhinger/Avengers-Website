<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0" >
    <title>Avengers Login</title>
    <link rel="stylesheet" href="style.css" >
</head>

<body>


    <div class="container">

        <div
            class="form-box"
            id="loginBox"
        >

            <h2>Sign In</h2>

            <p class="subtitle">
                Hi Avengers
            </p>


            <form id="loginForm">


                <div class="input-group">

                    <label for="loginEmail">Email</label>
                    <input type="email"id="loginEmail"placeholder="Enter your email"required>

                </div>


                <div class="input-group">

                    <label for="loginPassword">Password</label>
                    <input type="password"id="loginPassword" placeholder="Enter your password"required>

                </div>


                <button type="submit">
                    Sign In
                </button>


            </form>

            <p class="switch-text">Don't have an account?<span onclick="showSignup()"> Sign Up</span></p>

        </div>


        <div class="form-box hidden"id="signupBox">

            <h2>Sign Up</h2>

            <p class="subtitle">Create your account</p>
            <form id="signupForm">

                <div class="input-group">
                    <label for="signupUsername">Username</label>
                    <input type="text"id="signupUsername"placeholder="Enter your username" required>
                </div>

                <div class="input-group">

                    <label for="signupEmail"> Email</label>
                    <input type="email"id="signupEmail" placeholder="Enter your email"required>

                </div>


               

                <div class="input-group">

                    <label for="signupPassword">Password</label>
                    <input type="password"id="signupPassword" placeholder="Create a password"required>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password"id="confirmPassword"placeholder="Confirm your password"required>
                </div>

                <button type="submit">Sign Up</button>


            </form>

            <p class="switch-text">
                Already have an account?
                <span onclick="showLogin()">Sign In</span>
            </p>

        </div>


    </div>


    <script src="script.js"></script>

</body>

</html>
